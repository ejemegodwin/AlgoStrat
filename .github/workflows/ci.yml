name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: algostrat_ci
          POSTGRES_PASSWORD: algostrat-ci-password
          POSTGRES_DB: algostrat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U algostrat_ci -d algostrat_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://algostrat_ci:algostrat-ci-password@localhost:5432/algostrat_test
      TEST_DATABASE_URL: postgresql://algostrat_ci:algostrat-ci-password@localhost:5432/algostrat_test
      JWT_SECRET_KEY: ci-only-secret-not-used-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run test suite
        run: PYTHONPATH=backend python -m pytest -v
