<svg
  width="120"
  height="120"
  viewBox="0 0 120 120"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="mark-title"
>
  <title id="mark-title">AlgoStrat logo</title>
  <!--
    AlgoStrat brand mark — four ascending steps.
    The negative space between the steps forms the letter A.
    The highest step uses --verified green as its accent.
    Uses currentColor for dark/light theme compatibility.
  -->
  <!-- Step 1 (base, lowest) -->
  <rect
    x="20"
    y="78"
    width="80"
    height="12"
    rx="2"
    fill="currentColor"
    opacity="0.2"
  />
  <!-- Step 2 -->
  <rect
    x="36"
    y="66"
    width="48"
    height="12"
    rx="2"
    fill="currentColor"
    opacity="0.3"
  />
  <!-- Step 3 -->
  <rect
    x="52"
    y="54"
    width="16"
    height="12"
    rx="2"
    fill="currentColor"
    opacity="0.5"
  />
  <!-- Step 4 (top, brightest) -->
  <rect
    x="60"
    y="42"
    width="4"
    height="12"
    rx="2"
    fill="currentColor"
  />
  <!-- Green accent on the top step to represent verified progress -->
  <rect
    x="60"
    y="42"
    width="4"
    height="12"
    rx="2"
    fill="#2ecc71"
    opacity="0.8"
  />
</svg>
