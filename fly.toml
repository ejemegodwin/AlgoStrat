# fly.toml — AlgoStrat deployment configuration.
# Create the app first: `flyctl launch` (uses this file).
# Env vars (DATABASE_URL, JWT_SECRET_KEY, RECEIPT_SIGNING_KEY, CORS_ORIGINS, etc.)
# are set as Fly secrets: `flyctl secrets set KEY=value`.

app = "algostrat"

primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  JWT_ALGORITHM = "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES = "30"
  PLATFORM_FEE_PERCENT = "0"
  PAYMENT_PROVIDER = "simulated"
  STATIC_PATH = "/app/static"
  MARKETING_PATH = "/app/marketing"

[deploy]
  # Run migrations before starting new instances; release fails if migrations break.
  release_command = "alembic upgrade head"

[services]
  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/health/database"
    protocol = "http"
    tls_skip_verify = false

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
